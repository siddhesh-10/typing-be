name: Deploy to Development

on:
  push:
    branches:
      - develop
      - feat/intial

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy-infrastructure-dev:
    name: Deploy Infrastructure to Development
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy Infrastructure to Development
        run: |
          serverless deploy \
            --config serverless-infrastructure.yml \
            --stage dev \
            --region ${{ env.AWS_REGION }} \
            --verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DEV }}

  deploy-functions-dev:
    name: Deploy Functions to Development
    runs-on: ubuntu-latest
    needs: deploy-infrastructure-dev
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy Functions to Development
        run: |
          serverless deploy \
            --stage dev \
            --region ${{ env.AWS_REGION }} \
            --verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DEV }}

      - name: Get deployment info
        run: |
          echo "Development API URL: https://$(serverless info --stage dev --region ${{ env.AWS_REGION }} | grep 'ServiceEndpoint' | cut -d' ' -f2)"
        continue-on-error: true

  notify-dev:
    name: Notify Development Team
    runs-on: ubuntu-latest
    needs: deploy-functions-dev
    if: always() && needs.deploy-functions-dev.result != 'skipped'
    
    steps:
      - name: Notify on success
        if: needs.deploy-functions-dev.result == 'success'
        run: |
          echo "✅ Development deployment successful!"
          echo "Environment: Development"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify on failure
        if: needs.deploy-functions-dev.result == 'failure'
        run: |
          echo "❌ Development deployment failed!"
          echo "Environment: Development"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}" 