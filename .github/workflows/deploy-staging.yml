name: Deploy to Staging

on:
  push:
    branches:
      - staging
      - stage
  pull_request:
    branches:
      - staging
      - stage

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level moderate

  deploy-infrastructure-staging:
    name: Deploy Infrastructure to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stage')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy Infrastructure to Staging
        run: |
          serverless deploy \
            --config serverless-infrastructure.yml \
            --stage staging \
            --region ${{ env.AWS_REGION }} \
            --verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}

  deploy-functions-staging:
    name: Deploy Functions to Staging
    runs-on: ubuntu-latest
    needs: deploy-infrastructure-staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stage')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Deploy Functions to Staging
        run: |
          serverless deploy \
            --stage staging \
            --region ${{ env.AWS_REGION }} \
            --verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}

      - name: Get deployment info
        run: |
          echo "Staging API URL: https://$(serverless info --stage staging --region ${{ env.AWS_REGION }} | grep 'ServiceEndpoint' | cut -d' ' -f2)"
        continue-on-error: true

      - name: Run integration tests
        run: |
          echo "Running staging integration tests..."
          # Add integration tests here
          # Example: npm run test:integration
        continue-on-error: true

  notify-staging:
    name: Notify Staging Team
    runs-on: ubuntu-latest
    needs: deploy-functions-staging
    if: always() && needs.deploy-functions-staging.result != 'skipped'
    
    steps:
      - name: Notify on success
        if: needs.deploy-functions-staging.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"
          echo "Environment: Staging"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Ready for testing!"

      - name: Notify on failure
        if: needs.deploy-functions-staging.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
          echo "Environment: Staging"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}" 