service: typing-practice-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  
  # API Gateway configuration for API key authentication
  apiGateway:
    apiKeys:
      - typing-practice-api-key-${self:provider.stage}
    usagePlan:
      quota:
        limit: 10000
        period: MONTH
      throttle:
        burstLimit: 200
        rateLimit: 100
    apiKeySource: HEADER
  
  # Environment variables that will be available to all functions
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    # Import table names from infrastructure stack ONLY (with fallbacks for local dev)
    TYPING_TEXTS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.TypingTextsTableName, env:TYPING_TEXTS_TABLE, 'typing-texts-dev'}
    USERS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.UsersTableName, env:USERS_TABLE, 'users-dev'}
    SESSIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.SessionsTableName, env:SESSIONS_TABLE, 'sessions-dev'}
    LEADERBOARD_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.LeaderboardTableName, env:LEADERBOARD_TABLE, 'leaderboard-dev'}
    CHALLENGES_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.ChallengesTableName, env:CHALLENGES_TABLE, 'challenges-dev'}
    AI_SESSIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.AISessionsTableName, env:AI_SESSIONS_TABLE, 'ai-sessions-dev'}
    WEBSOCKET_CONNECTIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.WebSocketConnectionsTableName, env:WEBSOCKET_CONNECTIONS_TABLE, 'websocket-connections-dev'}
    # Import Cognito resources from infrastructure stack (for production)
    USER_POOL_ID: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}
    USER_POOL_CLIENT_ID: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolClientId, env:USER_POOL_CLIENT_ID}
    # External API keys
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, '*'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

  # IAM role statements for Lambda functions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/typing-texts-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/users-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sessions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/leaderboard-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/challenges-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ai-sessions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/websocket-connections-${self:provider.stage}"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
          Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID, 'us-east-1_test123456'}"
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: 
            - "arn:aws:execute-api:${self:provider.region}:*:*/@connections/*"

# API Gateway configuration
custom:
  apiGateway:
    restApiId: !Ref ApiGatewayRestApi
    restApiRootResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
  serverless-offline:
    httpPort: 3004
    websocketPort: 3005
    lambdaPort: 3003
    useChildProcesses: true

# Functions
functions:
  # User Functions
  createUser:
    handler: src/functions/user/createUser.handler
    events:
      - http:
          path: /users
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID, 'us-east-1_test123456'}

  getUser:
    handler: src/functions/user/getUser.handler
    events:
      - http:
          path: /users/{id}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID, 'us-east-1_test123456'}

  updateUser:
    handler: src/functions/user/updateUser.handler
    events:
      - http:
          path: /users/{id}
          method: put
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID, 'us-east-1_test123456'}

  deleteUser:
    handler: src/functions/user/deleteUser.handler
    events:
      - http:
          path: /users/{id}
          method: delete
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID, 'us-east-1_test123456'}

  getLeaderboard:
    handler: src/functions/user/getLeaderboard.handler
    events:
      - http:
          path: /leaderboard
          method: get
          cors: true
          private: true

  # Text Functions
  createText:
    handler: src/functions/text/createText.handler
    private: true
    events:
      - http:
          path: /texts
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getTexts:
    handler: src/functions/text/getTexts.handler
    events:
      - http:
          path: /texts
          method: get
          cors: true
          private: true

  getRandomText:
    handler: src/functions/text/getRandomText.js
    events:
      - http:
          path: /texts/random
          method: get
          cors: true
          private: true

  getTextById:
    handler: src/functions/text/getTextById.handler
    events:
      - http:
          path: /texts/{id}
          method: get
          cors: true
          private: true

  seedTexts:
    handler: src/functions/text/seedTexts.js
    events:
      - http:
          path: /texts/seed
          method: post
          cors: true
          private: true

  # Session Functions
  createSession:
    handler: src/functions/session/createSession.handler
    events:
      - http:
          path: /sessions
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getUserSessions:
    handler: src/functions/session/getUserSessions.handler
    events:
      - http:
          path: /sessions/user/{userId}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getSessionById:
    handler: src/functions/session/getSessionById.handler
    events:
      - http:
          path: /sessions/{id}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  updateSession:
    handler: src/functions/session/updateSession.handler
    events:
      - http:
          path: /sessions/{id}
          method: put
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  deleteSession:
    handler: src/functions/session/deleteSession.handler
    events:
      - http:
          path: /sessions/{id}
          method: delete
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getBestSessions:
    handler: src/functions/session/getBestSessions.handler
    events:
      - http:
          path: /sessions/best
          method: get
          cors: true
          private: true

  getRecentSessions:
    handler: src/functions/session/getRecentSessions.handler
    events:
      - http:
          path: /sessions/recent
          method: get
          cors: true
          private: true

  # Challenge Functions
  createChallenge:
    handler: src/functions/challenge/createChallenge.handler
    events:
      - http:
          path: /challenges
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getChallenge:
    handler: src/functions/challenge/getChallenge.handler
    events:
      - http:
          path: /challenges/{id}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  getUserChallenges:
    handler: src/functions/challenge/getUserChallenges.handler
    events:
      - http:
          path: /challenges/user/{userId}
          method: get
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  acceptChallenge:
    handler: src/functions/challenge/acceptChallenge.handler
    events:
      - http:
          path: /challenges/{id}/accept
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  declineChallenge:
    handler: src/functions/challenge/declineChallenge.handler
    events:
      - http:
          path: /challenges/{id}/decline
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  # AI Functions
  createAISession:
    handler: src/functions/ai/createAISession.handler
    events:
      - http:
          path: /ai/sessions
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  generateText:
    handler: src/functions/ai/generateText.handler
    events:
      - http:
          path: /ai/texts
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  generateFeedback:
    handler: src/functions/ai/generateFeedback.handler
    events:
      - http:
          path: /ai/feedback
          method: post
          cors: true
          authorizer:
            name: cognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId, env:USER_POOL_ID}

  # WebSocket Functions
  websocketAuthorizer:
    handler: src/functions/websocket/authorizer.handler

  websocketConnect:
    handler: src/functions/websocket/connect.handler
    events:
      - websocket:
          route: $connect
          authorizer:
            name: websocketAuthorizer
            identitySource:
              - 'route.request.header.Authorization'

  websocketDisconnect:
    handler: src/functions/websocket/disconnect.handler
    events:
      - websocket:
          route: $disconnect

  websocketDefault:
    handler: src/functions/websocket/default.handler
    events:
      - websocket:
          route: $default

# Resources (minimal, most resources are in infrastructure file)
resources:
  Resources:
    # Cognito Authorizer for API Gateway
    CognitoAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: cognitoAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId}"

    # WebSocket Authorizer
    WebSocketAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: websocketAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: route.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId}"

    # API Key for public endpoints
    ApiKey:
      Type: AWS::ApiGateway::ApiKey
      Properties:
        Name: typing-practice-api-key-${self:provider.stage}
        Description: API Key for public endpoints authentication
        Enabled: true
        GenerateDistinctId: true

    # Usage Plan for API Key
    UsagePlan:
      Type: AWS::ApiGateway::UsagePlan
      Properties:
        UsagePlanName: typing-practice-usage-plan-${self:provider.stage}
        Description: Usage plan for typing practice API
        ApiStages:
          - ApiId: !Ref ApiGatewayRestApi
            Stage: ${self:provider.stage}
        Quota:
          Limit: 10000
          Period: MONTH
        Throttle:
          BurstLimit: 200
          RateLimit: 100

    # Usage Plan Key Association
    UsagePlanKey:
      Type: AWS::ApiGateway::UsagePlanKey
      Properties:
        KeyId: !Ref ApiKey
        KeyType: API_KEY
        UsagePlanId: !Ref UsagePlan

# Plugins
plugins:
  - serverless-offline
  - serverless-dotenv-plugin
