service: typing-practice-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  
  # API Gateway configuration for API key authentication
  apiGateway:
    apiKeys:
      - typing-practice-api-key-${self:provider.stage}
    usagePlan:
      quota:
        limit: 10000
        period: MONTH
      throttle:
        burstLimit: 200
        rateLimit: 100
    apiKeySource: HEADER
  
  # Environment variables that will be available to all functions
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    # Import table names from infrastructure stack ONLY (with fallbacks for local dev)
    TYPING_TEXTS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.TypingTextsTableName, env:TYPING_TEXTS_TABLE, 'typing-texts-dev'}
    USERS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.UsersTableName, env:USERS_TABLE, 'users-dev'}
    SESSIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.SessionsTableName, env:SESSIONS_TABLE, 'sessions-dev'}
    LEADERBOARD_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.LeaderboardTableName, env:LEADERBOARD_TABLE, 'leaderboard-dev'}
    CHALLENGES_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.ChallengesTableName, env:CHALLENGES_TABLE, 'challenges-dev'}
    AI_SESSIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.AISessionsTableName, env:AI_SESSIONS_TABLE, 'ai-sessions-dev'}
    WEBSOCKET_CONNECTIONS_TABLE: ${cf:typing-practice-infrastructure-${self:provider.stage}.WebSocketConnectionsTableName, env:WEBSOCKET_CONNECTIONS_TABLE, 'websocket-connections-dev'}
    # Import Cognito resources from infrastructure stack (for production)
    USER_POOL_ID: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolId}
    USER_POOL_CLIENT_ID: ${cf:typing-practice-infrastructure-${self:provider.stage}.UserPoolClientId}
    # External API keys
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, '*'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

  # IAM role statements for Lambda functions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/typing-texts-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/users-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sessions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/leaderboard-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/challenges-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ai-sessions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/websocket-connections-${self:provider.stage}"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminDeleteUser
            - cognito-idp:ListUsers
          Resource: ${self:custom.COGNITOARN}
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: 
            - "arn:aws:execute-api:${self:provider.region}:*:*/@connections/*"

# API Gateway configuration
custom:
  apiGateway:
    restApiId: !Ref ApiGatewayRestApi
    restApiRootResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
  serverless-offline:
    httpPort: 3004
    websocketPort: 3005
    lambdaPort: 3003
    useChildProcesses: true
  # Cognito ARN from infrastructure stack
  COGNITOARN: ${cf:typing-practice-infrastructure-${self:provider.stage}.CognitoUserPoolArn}

# Functions
functions:
  # User Functions
  createUser:
    name: createUser-${self:provider.stage}
    handler: src/functions/user/createUser.handler
    events:
      - http:
          path: /users
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getUser:
    name: getUser-${self:provider.stage}
    handler: src/functions/user/getUser.handler
    events:
      - http:
          path: /users/{id}
          method: get
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  updateUser:
    name: updateUser-${self:provider.stage}
    handler: src/functions/user/updateUser.handler
    events:
      - http:
          path: /users/{id}
          method: put
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getLeaderboard:
    name: getLeaderboard-${self:provider.stage}
    handler: src/functions/user/getLeaderboard.handler
    events:
      - http:
          path: /leaderboard
          method: get
          cors: true
          private: true

  # Text Functions
  createText:
    name: createText-${self:provider.stage}
    handler: src/functions/text/createText.handler
    private: true
    events:
      - http:
          path: /texts
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getTexts:
    name: getTexts-${self:provider.stage}
    handler: src/functions/text/getTexts.handler
    events:
      - http:
          path: /texts
          method: get
          cors: true
          private: true

  getRandomText:
    name: getRandomText-${self:provider.stage}
    handler: src/functions/text/getRandomText.js
    events:
      - http:
          path: /texts/random
          method: get
          cors: true
          private: true

  getTextById:
    name: getTextById-${self:provider.stage}
    handler: src/functions/text/getTextById.handler
    events:
      - http:
          path: /texts/{id}
          method: get
          cors: true
          private: true

  seedTexts:
    name: seedTexts-${self:provider.stage}
    handler: src/functions/text/seedTexts.js
    events:
      - http:
          path: /texts/seed
          method: post
          cors: true
          private: true

  # Session Functions
  createSession:
    name: createSession-${self:provider.stage}
    handler: src/functions/session/createSession.handler
    events:
      - http:
          path: /sessions
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getUserSessions:
    name: getUserSessions-${self:provider.stage}
    handler: src/functions/session/getUserSessions.handler
    events:
      - http:
          path: /sessions/user/{userId}
          method: get
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getSessionById:
    name: getSessionById-${self:provider.stage}
    handler: src/functions/session/getSessionById.handler
    events:
      - http:
          path: /sessions/{id}
          method: get
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  updateSession:
    name: updateSession-${self:provider.stage}
    handler: src/functions/session/updateSession.handler
    events:
      - http:
          path: /sessions/{id}
          method: put
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  deleteSession:
    name: deleteSession-${self:provider.stage}
    handler: src/functions/session/deleteSession.handler
    events:
      - http:
          path: /sessions/{id}
          method: delete
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getBestSessions:
    name: getBestSessions-${self:provider.stage}
    handler: src/functions/session/getBestSessions.handler
    events:
      - http:
          path: /sessions/best
          method: get
          cors: true
          private: true

  getRecentSessions:
    name: getRecentSessions-${self:provider.stage}
    handler: src/functions/session/getRecentSessions.handler
    events:
      - http:
          path: /sessions/recent
          method: get
          cors: true
          private: true

  # Challenge Functions
  createChallenge:
    name: createChallenge-${self:provider.stage}
    handler: src/functions/challenge/createChallenge.handler
    events:
      - http:
          path: /challenges
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getChallenge:
    name: getChallenge-${self:provider.stage}
    handler: src/functions/challenge/getChallenge.handler
    events:
      - http:
          path: /challenges/{id}
          method: get
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  getUserChallenges:
    name: getUserChallenges-${self:provider.stage}
    handler: src/functions/challenge/getUserChallenges.handler
    events:
      - http:
          path: /challenges/user/{userId}
          method: get
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  acceptChallenge:
    name: acceptChallenge-${self:provider.stage}
    handler: src/functions/challenge/acceptChallenge.handler
    events:
      - http:
          path: /challenges/{id}/accept
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  declineChallenge:
    name: declineChallenge-${self:provider.stage}
    handler: src/functions/challenge/declineChallenge.handler
    events:
      - http:
          path: /challenges/{id}/decline
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  # AI Functions
  createAISession:
    name: createAISession-${self:provider.stage}
    handler: src/functions/ai/createAISession.handler
    events:
      - http:
          path: /ai/sessions
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  generateText:
    name: generateText-${self:provider.stage}
    handler: src/functions/ai/generateText.handler
    events:
      - http:
          path: /ai/texts
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  generateFeedback:
    name: generateFeedback-${self:provider.stage}
    handler: src/functions/ai/generateFeedback.handler
    events:
      - http:
          path: /ai/feedback
          method: post
          cors: true
          authorizer:
            arn: ${self:custom.COGNITOARN}

  # WebSocket Functions
  websocketAuthorizer:
    name: websocketAuthorizer-${self:provider.stage}
    handler: src/functions/websocket/authorizer.handler

  websocketConnect:
    name: websocketConnect-${self:provider.stage}
    handler: src/functions/websocket/connect.handler
    events:
      - websocket:
          route: $connect
          authorizer:
            name: websocketAuthorizer
            identitySource:
              - 'route.request.header.Authorization'

  websocketDisconnect:
    name: websocketDisconnect-${self:provider.stage}
    handler: src/functions/websocket/disconnect.handler
    events:
      - websocket:
          route: $disconnect

  websocketDefault:
    name: websocketDefault-${self:provider.stage}
    handler: src/functions/websocket/default.handler
    events:
      - websocket:
          route: $default

# Resources (minimal, most resources are in infrastructure file)
resources:
  Resources:
    # No additional resources needed - using inline authorizers





# Plugins
plugins:
  - serverless-plugin-typescript
  - serverless-offline
  - serverless-dotenv-plugin
